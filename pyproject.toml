[project]
name = "owvoice"
version = "0.2.0"
description = "OwVoice local voice synthesis application"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "numba==0.67.0",
    "librosa==0.10.2",
    "soundfile==0.14.0",
    "ctranslate2==4.8.1",
    "fastapi[standard]==0.115.14",
    "uvicorn[standard]==0.34.3",
    "requests==2.32.4",
    "pydantic==2.10.6",
    "PySide6==6.9.2",
    "PySide6_Addons==6.9.2",
    "PySide6_Essentials==6.9.2",
    "shiboken6==6.9.2",
    "transformers==4.50.0",
    "huggingface_hub==0.36.2",
    "pytorch-lightning==2.6.5",
    "torchmetrics==1.5.0",
    "peft==0.17.1",
    "sentencepiece==0.2.2",
    "rotary-embedding-torch==0.9.1",
    "x-transformers==2.28.2",
    "einops==0.8.2",
    "einx==0.4.3",
    "tqdm==4.70.0",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
    "chardet==5.2.0",
    "cn2an==0.5.24",
    "pypinyin==0.55.0",
    "jieba==0.42.1",
    "split-lang==2.1.1",
    "fast-langdetect==1.0.1",
    "wordsegment==1.3.1",
    "g2p-en==2.1.0",
    "pyopenjtalk-plus==0.4.1.post9",
    "opencc==1.4.2",
    "ToJyutping==3.2.0",
    "g2pk2==0.0.3",
    "ko-pron==1.3",
    "inflect==7.5.0",
    "matplotlib==3.10.9",
    "nltk==3.10.3",
    "ffmpeg-python==0.2.0",
]

[project.optional-dependencies]
cpu = [
    "torch==2.7.0+cpu",
    "torchaudio==2.7.0+cpu",
    "onnxruntime==1.23.2",
]
gpu = [
    "torch==2.7.0+cu128",
    "torchaudio==2.7.0+cu128",
    # G2PW 的 ONNX 推理体量很小，统一使用 CPU 版可避免 CPU/GPU 包互相覆盖 DLL。
    "onnxruntime==1.23.2",
]
training = [
    "tensorboard==2.21.0",
    "gradio==4.44.1",
    "funasr==1.0.27",
    "modelscope==1.39.1",
    "av==17.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pyinstaller==6.22.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".cache", "_internal", "dist", "GPT-SoVITS", "data", "logs", "output"]
addopts = "-ra"

[tool.uv]
# CPU 和 GPU 是互斥安装方案，不能同时装进同一个虚拟环境。
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
